title: Ubuntu Process Execution with Placement Audit Key
id: 8f78d0c1-7a2b-4e9f-9f25-2d6a2d3f8101
status: experimental
description: Detects successful Linux process execution events tagged with the placement_test audit key.
logsource:
  product: linux
  service: auditd
detection:
  selection:
    data.audit.key: placement_test
    data.audit.type: SYSCALL
    data.audit.success: 'yes'
  condition: selection
falsepositives:
  - Legitimate process execution recorded by the placement_test audit rule
level: informational
