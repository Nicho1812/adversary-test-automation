name: Lab CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    env:
      LAB_DIR: '${{ github.workspace }}\lab'
      PYTHONUTF8: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start lab VM and wait for SSH
        shell: cmd
        run: |
          cd /d "%LAB_DIR%"
          vagrant up
          if errorlevel 1 exit /b 1

          for /L %%i in (1,1,24) do (
            vagrant ssh -c "echo SSH_OK" >nul 2>&1
            if not errorlevel 1 goto ssh_ready
            timeout /t 5 /nobreak >nul
          )

          echo ERROR: SSH did not become ready after 2 minutes.
          vagrant status
          exit /b 1

          :ssh_ready
          echo SSH connection confirmed.

      - name: Execute Ubuntu discovery and generate evidence
        shell: cmd
        run: |
          python scripts\run_lab_operation.py
          if errorlevel 1 exit /b 1

      - name: Validate evidence
        shell: cmd
        run: |
          python -m pytest -q tests
          if errorlevel 1 exit /b 1

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-ci-evidence
          path: artifacts/
          if-no-files-found: warn
