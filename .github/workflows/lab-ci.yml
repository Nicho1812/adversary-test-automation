
name: Lab CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    env:
      LAB_DIR: '${{ github.workspace }}\lab'
      PYTHONUTF8: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify lab VM is accessible
        shell: cmd
        run: |
          cd /d "%LAB_DIR%"
          vagrant status | findstr /C:"running (virtualbox)"
          if errorlevel 1 (
            vagrant up
            if errorlevel 1 exit /b 1
          )
          vagrant ssh -c "echo SSH_OK"
          if errorlevel 1 exit /b 1

      - name: Execute Ubuntu discovery and generate evidence
        shell: cmd
        run: |
          python scripts\run_lab_operation.py
          if errorlevel 1 exit /b 1

      - name: Validate evidence
        shell: cmd
        run: |
          python -m pytest -q tests
          if errorlevel 1 exit /b 1

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-ci-evidence
          path: artifacts/
          if-no-files-found: warn
